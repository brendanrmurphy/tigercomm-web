<section class="hover-tabs" data-hover-tabs>
  <div class="hover-tabs__left" role="tablist" aria-orientation="vertical">
    {% for tab in module.tabs %}
      <button
        class="hover-tabs__tab{% if loop.first %} is-active{% endif %}"
        type="button"
        role="tab"
        aria-selected="{{ "true" if loop.first else "false" }}"
        data-tab="{{ loop.index0 }}"
      >
        <span>{{ tab.tab_title }}</span>
      </button>
    {% endfor %}
  </div>
  <div class="hover-tabs__right">
    {% for tab in module.tabs %}
      <div class="hover-tabs__panel{% if loop.first %} is-active{% endif %}" role="tabpanel" data-panel="{{ loop.index0 }}"{% if not loop.first %} hidden{% endif %}>
        {{ tab.tab_content }}
      </div>
    {% endfor %}
  </div>
  <script>
    (function () {
      document.querySelectorAll("[data-hover-tabs]").forEach((root) => {
        if (root.dataset.hoverTabsInitialized === "true") return;
        root.dataset.hoverTabsInitialized = "true";

        const tabs = Array.from(root.querySelectorAll(".hover-tabs__tab"));
        const panels = Array.from(root.querySelectorAll(".hover-tabs__panel"));
        if (!tabs.length || !panels.length) return;

        // Start state: whatever is marked active in markup, else 0
        let activeIndex = tabs.findIndex((t) =>
          t.classList.contains("is-active"),
        );
        if (activeIndex < 0) activeIndex = 0;

        // Sticky state: last clicked (defaults to initial active)
        let committedIndex = activeIndex;

        // Tracks whether the current active state is coming from hover (temporary)
        let isHoverPreview = false;

        function setActive(idx, { commit = false } = {}) {
          activeIndex = idx;

          if (commit) {
            committedIndex = idx;
            isHoverPreview = false;
          }

          tabs.forEach((t, i) => {
            const isActive = i === activeIndex;
            t.classList.toggle("is-active", isActive);
            t.setAttribute("aria-selected", isActive ? "true" : "false");
            t.setAttribute("tabindex", isActive ? "0" : "-1");
          });

          panels.forEach((p, i) => {
            const isActive = i === activeIndex;
            p.classList.toggle("is-active", isActive);
            if (isActive) p.removeAttribute("hidden");
            else p.setAttribute("hidden", "");
          });
        }

        tabs.forEach((tab, i) => {
          // Hover = preview only (not sticky)
          tab.addEventListener("mouseenter", () => {
            isHoverPreview = true;
            setActive(i, { commit: false });
          });

          // Click = sticky
          tab.addEventListener("click", () => {
            setActive(i, { commit: true });
          });

          tab.addEventListener("keydown", (e) => {
            // Arrow navigation previews (not sticky) unless they "commit" separately
            if (e.key === "ArrowDown" || e.key === "ArrowRight") {
              e.preventDefault();
              const next = (activeIndex + 1) % tabs.length;
              isHoverPreview = true;
              setActive(next, { commit: false });
              tabs[next].focus();
            }

            if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
              e.preventDefault();
              const prev = (activeIndex - 1 + tabs.length) % tabs.length;
              isHoverPreview = true;
              setActive(prev, { commit: false });
              tabs[prev].focus();
            }

            // Optional: commit with Enter/Space for accessibility
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              setActive(i, { commit: true });
            }
          });
        });

        root.addEventListener("mouseenter", () =>
          root.classList.add("is-hovering"),
        );

        // When leaving the whole component:
        // If the user only hovered (didn't click), revert to last committed tab.
        root.addEventListener("mouseleave", () => {
          root.classList.remove("is-hovering");
          if (isHoverPreview) {
            setActive(committedIndex, { commit: false });
            isHoverPreview = false;
          }
        });

        // Initialize
        setActive(activeIndex, { commit: true });
      });
    })();
  </script>
</section>
